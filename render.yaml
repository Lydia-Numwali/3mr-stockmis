services:
  # Backend API
  - type: web
    name: centurion-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: bash build-backend.sh
    startCommand: bash start-backend.sh
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://centurion_user:8boz7XJ6kkdUXiqZmElYjLg03n4iFCdo@dpg-d99raacs728c73do4mpg-a.frankfurt-postgres.render.com/centurion_logistics
      - key: JWT_SECRET
        value: Centurion2026SecureLogisticsSecretKey
      - key: JWT_EXPIRES_IN
        value: 7d

  # Frontend
  - type: web
    name: centurion-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: .next
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://centurion-backend.onrender.com/api
